<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 주민등록증</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        }

        body {
            background-color: #f5f6f8;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        /* 상단 헤더 */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: #fff;
        }

        .header-title {
            font-size: 19px;
            font-weight: 700;
            color: #111;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #222;
        }

        /* 안내 툴팁 */
        .notice-banner {
            background: #ffffff;
            margin: 0 24px 10px 24px;
            padding: 10px 16px;
            border-radius: 20px;
            text-align: center;
            font-size: 13px;
            color: #444;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid #f0f0f0;
        }

        /* 메인 카드 영역 */
        .card-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            position: relative;
        }

        /* 카드 본체 */
        .id-card {
            width: 290px;
            height: 460px;
            background: linear-gradient(135deg, #fdfbf7 0%, #f5eee2 50%, #fcedea 100%);
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            border: 1px solid #e8dec8;
            position: relative;
            overflow: hidden;
        }

        /* 원본 신분증의 곡선 및 지구본 패턴 SVG */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 세로 방향 텍스트를 위한 레이아웃 (90도 회전 방식) */
        .card-vertical-content {
            position: absolute;
            top: 24px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            writing-mode: vertical-rl; /* 세로쓰기 설정 */
            text-orientation: mixed;
            z-index: 2;
        }

        .gov-logo-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .gov-symbol {
            width: 22px;
            height: 22px;
        }

        .card-title-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #2b2b2b;
        }

        .info-group {
            margin-right: 12px;
        }

        .info-name {
            font-size: 22px;
            font-weight: 800;
            color: #111;
            letter-spacing: 2px;
            margin-left: 8px;
        }

        .info-rrn {
            font-size: 15px;
            font-weight: 700;
            color: #333;
            letter-spacing: 1.5px;
            margin-left: 12px;
        }

        .info-address {
            font-size: 12px;
            color: #444;
            line-height: 1.5;
            font-weight: 600;
            margin-left: 10px;
        }

        /* 발급일 및 발급기관 (세로) */
        .issuer-group {
            position: absolute;
            bottom: 30px;
            left: 20px;
            writing-mode: vertical-rl;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .issue-date {
            font-size: 12px;
            color: #444;
            font-weight: 600;
        }

        .issuer-name {
            font-size: 15px;
            font-weight: 800;
            color: #111;
            letter-spacing: 1px;
        }

        /* 직인 (빨간 도장) */
        .seal-mark {
            width: 36px;
            height: 36px;
            border: 2px solid #d32f2f;
            color: #d32f2f;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            line-height: 1.1;
            writing-mode: horizontal-tb;
            margin-top: 8px;
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* 증명사진 위치 */
        .photo-box {
            position: absolute;
            bottom: 24px;
            right: 20px;
            width: 105px;
            height: 135px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #aaa;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            z-index: 2;
            background-color: #ddd;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 하단 법적 효력 및 버튼 */
        .legal-info {
            text-align: center;
            font-size: 13px;
            color: #555;
            margin-top: 10px;
            font-weight: 600;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 16px;
            background-color: #fff;
            border-top: 1px solid #f0f0f0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: #333;
            background: #f4f6f8;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 상단 헤더 -->
    <div class="app-header">
        <button class="icon-btn">☰</button>
        <div class="header-title">모바일 신분증</div>
        <button class="icon-btn">+</button>
    </div>

    <!-- 안내 상단 바 -->
    <div class="notice-banner">
        <span>👆</span> 누르거나 흔들어서 모든 정보를 볼 수 있어요.
    </div>

    <!-- 신분증 메인 카드 -->
    <div class="card-wrap">
        <div class="id-card">
            <!-- 배경 곡선 및 지구본 모양 SVG 패턴 -->
            <svg class="bg-pattern" viewBox="0 0 290 460" xmlns="http://www.w3.org/2000/svg">
                <!-- 동그란 무지개빛 곡선 무늬 -->
                <circle cx="200" cy="180" r="140" fill="none" stroke="#e3ceaa" stroke-width="0.8" opacity="0.4" />
                <circle cx="200" cy="180" r="120" fill="none" stroke="#d4b8df" stroke-width="0.8" opacity="0.4" />
                <circle cx="200" cy="180" r="100" fill="none" stroke="#a3c4f3" stroke-width="0.8" opacity="0.4" />
                
                <path d="M -20,220 Q 100,160 200,280 T 310,220" fill="none" stroke="#cbb4d4" stroke-width="1" opacity="0.3"/>
                <path d="M -20,240 Q 100,180 200,300 T 310,240" fill="none" stroke="#f3c4fb" stroke-width="1" opacity="0.3"/>

                <!-- 지구본 모양 패턴 -->
                <g stroke="#c7b08b" stroke-width="0.7" fill="none" opacity="0.35" transform="translate(40, 160)">
                    <circle cx="50" cy="50" r="45" />
                    <ellipse cx="50" cy="50" rx="45" ry="18" />
                    <ellipse cx="50" cy="50" rx="18" ry="45" />
                    <path d="M 5,50 L 95,50 M 50,5 L 50,95" />
                </g>
            </svg>

            <!-- 세로 방향 인적사항 레이아웃 -->
            <div class="card-vertical-content">
                <div class="gov-logo-group">
                    <!-- 대한민국 정부 상징 로고 -->
                    <svg class="gov-symbol" viewBox="0 0 100 100">
                        <path d="M50 5 C25 5 5 25 5 50 C5 75 25 95 50 95 C75 95 95 75 95 50 Z" fill="#154374"/>
                        <path d="M50 5 C50 30 75 30 75 50 C75 70 50 70 50 95 C25 95 25 70 25 50 C25 30 50 30 50 5 Z" fill="#007a3d"/>
                        <circle cx="50" cy="50" r="15" fill="#d32f2f"/>
                    </svg>
                    <div class="card-title-text">주민등록증</div>
                </div>

                <div class="info-group">
                    <div class="info-name">김성준</div>
                    <div class="info-rrn">060413-[RRN Omitted]</div>
                    <div class="info-address">서울특별시 서초구 신반포로15길 19<br>(반포동, 아크로리버파크)</div>
                </div>
            </div>

            <!-- 하단 발급기관 및 직인 -->
            <div class="issuer-group">
                <div class="issue-date">2023.04.19.</div>
                <div class="issuer-name">서울특별시 서초구청장</div>
                <div class="seal-mark">서울 특별시<br>서초구청장인</div>
            </div>

            <!-- 증명사진 -->
            <div class="photo-box">
                <img src="https://via.placeholder.com/105x135/b0b0b0/ffffff?text=PHOTO" alt="증명사진">
            </div>
        </div>
    </div>

    <!-- 하단 효력 안내 -->
    <div class="legal-info">
        ⚠️ 법적 효력 안내
    </div>

    <!-- 하단 메뉴 버튼 -->
    <div class="bottom-nav">
        <div class="nav-item">
            <span>📱</span> 나의 QR
        </div>
        <div class="nav-item">
            <span>📷</span> QR 촬영
        </div>
    </div>
</div>

</body>
</html>
