<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 신분증</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        }

        body {
            background-color: #f7f8fa;
            color: #222;
        }

        .container {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f7f8fa;
        }

        .demo-bar {
            background-color: #ff4d4f;
            color: #fff;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 0;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #f0f0f0;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #111;
        }

        /* 1. 비밀번호 입력 화면 */
        .auth-screen {
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: calc(100vh - 30px);
            background-color: #fff;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 30px 0;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #e0e0e0;
        }

        .dot.active {
            background-color: #4A90E2;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key-btn {
            height: 55px;
            border: none;
            background: transparent;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 2. 신분증 목록 조회 화면 (4737_2.jpg) */
        .list-screen {
            padding: 20px;
        }

        .list-screen-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card-item {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #eaeaea;
        }

        .card-item-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .card-info-row {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            display: flex;
            gap: 12px;
        }

        .card-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-sub {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            background: #f8f8f8;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-primary {
            flex: 1;
            padding: 10px;
            border: none;
            background: #4a4a4a;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        /* 3. 메뉴 화면 (4741.jpg) */
        .menu-screen {
            background-color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .menu-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .menu-icons {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 20px;
        }

        .menu-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #444;
        }

        .banner-box {
            background-color: #f7f1e5;
            border-radius: 12px;
            padding: 16px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 24px;
            color: #5a4020;
        }

        .menu-list-section {
            margin-bottom: 24px;
        }

        .menu-section-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }

        .menu-item-row {
            padding: 12px 0;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        /* 4. 메인 신분증 카카오형/기본형 레이아웃 */
        .notice-banner {
            background: #fff;
            margin: 12px 20px;
            padding: 10px;
            border-radius: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .id-card-wrap {
            display: flex;
            justify-content: center;
            padding: 10px 20px;
        }

        .id-card {
            width: 100%;
            max-width: 330px;
            height: 480px;
            background-color: #fbf7ee;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 1px solid #ede5d5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .card-header-v {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
        }

        .card-title-v {
            writing-mode: vertical-rl;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .card-body-v {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .clickable-rrn {
            cursor: pointer;
            background-color: rgba(0,0,0,0.03);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .card-footer-v {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .photo-box {
            width: 100px;
            height: 130px;
            background-color: #ddd;
            border-radius: 4px;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 5. 신분증 상세보기 모달 (4743.jpg 스타일) */
        .dark-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0b1320;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .dark-card {
            width: 85%;
            max-width: 320px;
            height: 480px;
            background-color: #fbf7ee;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .close-dark-btn {
            margin-top: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.2);
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 모달 공통 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 800;
        }

        .modal-body {
            background: #fff;
            width: 90%;
            max-width: 340px;
            border-radius: 16px;
            padding: 20px;
        }

        .modal-body input {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .bottom-nav {
            margin-top: auto;
            display: flex;
            background-color: #fff;
            padding: 12px 0;
            border-top: 1px solid #eee;
        }

        .nav-btn {
            flex: 1;
            border: none;
            background: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="demo-bar">모바일신분증 뭐든지간편하게!</div>

    <!-- 메인 컨텐츠 동적 전환 영역 -->
    <div id="appBody"></div>
</div>

<!-- 정보 수정 모달 창 (+ 버튼) -->
<div class="modal" id="editModal">
    <div class="modal-body">
        <h3 style="margin-bottom:12px;">신분증 정보 수정</h3>
        <label style="font-size:12px;">이름</label>
        <input type="text" id="editName" value="김성준">
        
        <label style="font-size:12px;">주민등록번호 뒷자리</label>
        <input type="text" id="editRrnBack" value="3614872">
        
        <label style="font-size:12px;">도로명 주소</label>
        <input type="text" id="editAddr1" value="서울특별시 서초구 신반포로15길19">

        <label style="font-size:12px;">상세 주소</label>
        <input type="text" id="editAddr2" value="아크로리버파크 103동 1104호">

        <label style="font-size:12px;">사진 변경</label>
        <input type="file" id="editPhoto" accept="image/*">

        <div style="display:flex; gap:8px; margin-top:10px;">
            <button onclick="closeEditModal()" style="flex:1; padding:10px; border:none; background:#eee; border-radius:6px;">취소</button>
            <button onclick="saveInfo()" style="flex:1; padding:10px; border:none; background:#4A90E2; color:white; border-radius:6px; font-weight:bold;">저장</button>
        </div>
    </div>
</div>

<!-- 수직 확장 카드 보기 모달 (4743.jpg) -->
<div class="dark-modal" id="darkDetailModal">
    <div class="dark-card">
        <div class="card-header-v">
            <div style="width:20px; height:20px; background:red; border-radius:50%;"></div>
            <div class="card-title-v">주민등록증</div>
        </div>
        <div class="card-body-v">
            <div class="vertical-text" id="darkName">김성준</div>
            <div class="vertical-text" id="darkRrn">060413-3614872</div>
            <div class="vertical-text" id="darkAddr">서울특별시 서초구 신반포로15길19 아크로리버파크 103동 1104호</div>
        </div>
        <div class="card-footer-v">
            <div class="photo-box">
                <img id="darkPhoto" src="https://via.placeholder.com/100x130/cccccc/ffffff?text=PHOTO" alt="사진">
            </div>
            <div style="text-align:right; font-size:11px; line-height:1.4;">
                2023.04.19.<br>
                서울특별시 서초구청장
            </div>
        </div>
    </div>
    <div style="color:white; margin-top:15px; text-decoration:underline; cursor:pointer;" onclick="alert('NFC 기능이 동작합니다.')">NFC로 제출하기</div>
    <button class="close-dark-btn" onclick="closeDarkModal()">✕</button>
</div>

<script>
    // 상태 관리
    let state = {
        name: "김성준",
        rrnFront: "060413",
        rrnBack: "3614872",
        showFullRrn: false,
        address1: "서울특별시 서초구 신반포로15길19",
        address2: "아크로리버파크 103동 1104호",
        photoSrc: "https://via.placeholder.com/100x130/cccccc/ffffff?text=PHOTO",
        pinInput: [],
        targetPin: "777777"
    };

    // 앱 시작점: 비밀번호 화면
    renderAuthScreen();

    // 1. 비밀번호 입력 화면
    function renderAuthScreen() {
        state.pinInput = [];
        const app = document.getElementById('appBody');
        app.innerHTML = `
            <div class="auth-screen">
                <div style="text-align:center;">
                    <h2 style="font-size:18px; margin-bottom:8px;">모바일 신분증</h2>
                    <p style="font-size:13px; color:#666;">비밀번호 6자리를 입력해 주세요</p>
                    <p style="font-size:12px; color:#ff4d4f; margin-top:4px;">(테스트 비밀번호: 777777)</p>
                    <div class="pin-dots">
                        <div class="dot" id="dot0"></div>
                        <div class="dot" id="dot1"></div>
                        <div class="dot" id="dot2"></div>
                        <div class="dot" id="dot3"></div>
                        <div class="dot" id="dot4"></div>
                        <div class="dot" id="dot5"></div>
                    </div>
                </div>
                <div class="keypad">
                    ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key-btn" onclick="pressKey('${n}')">${n}</button>`).join('')}
                    <button class="key-btn" style="font-size:13px;" onclick="renderAuthScreen()">초기화</button>
                    <button class="key-btn" onclick="pressKey('0')">0</button>
                    <button class="key-btn" style="font-size:13px;" onclick="deleteKey()">←</button>
                </div>
            </div>
        `;
    }

    function pressKey(num) {
        if (state.pinInput.length < 6) {
            state.pinInput.push(num);
            updateDots();
            if (state.pinInput.length === 6) {
                if (state.pinInput.join('') === state.targetPin) {
                    renderListScreen(); // 비밀번호 풀리면 목록 조회 화면 (4737_2.jpg)
                } else {
                    alert('비밀번호가 일치하지 않습니다. (777777)');
                    renderAuthScreen();
                }
            }
        }
    }

    function deleteKey() {
        state.pinInput.pop();
        updateDots();
    }

    function updateDots() {
        for (let i = 0; i < 6; i++) {
            const dot = document.getElementById(`dot${i}`);
            if (dot) {
                if (i < state.pinInput.length) dot.classList.add('active');
                else dot.classList.remove('active');
            }
        }
    }

    // 2. 신분증 목록 조회 화면 (4737_2.jpg)
    function renderListScreen() {
        const app = document.getElementById('appBody');
        app.innerHTML = `
            <div class="app-header">
                <button class="icon-btn" onclick="renderMenuScreen()">☰</button>
                <div class="header-title">신분증 목록 조회</div>
                <div style="width:24px;"></div>
            </div>
            <div class="list-screen">
                <div class="card-item">
                    <div class="card-item-title">모바일 주민등록증</div>
                    <div class="card-info-row"><span>발급대상</span><span>주민등록증 소지자</span></div>
                    <div class="card-info-row"><span>준비물</span><span>IC 주민등록증</span></div>
                    <div class="card-btn-group">
                        <button class="btn-sub">발급방법</button>
                        <button class="btn-primary" onclick="renderMainCardScreen()">조회하기</button>
                    </div>
                </div>

                <div class="card-item">
                    <div class="card-item-title">모바일 운전면허증</div>
                    <div class="card-info-row"><span>발급대상</span><span>1종, 2종 자동차운전면허 소지자</span></div>
                    <div class="card-info-row"><span>준비물</span><span>IC 자동차운전면허증</span></div>
                    <div class="card-btn-group">
                        <button class="btn-sub">발급방법</button>
                        <button class="btn-primary" onclick="alert('운전면허증 시연 준비 중입니다.')">조회하기</button>
                    </div>
                </div>
            </div>
        `;
    }

    // 3. 메뉴 화면 (4741.jpg)
    function renderMenuScreen() {
        const app = document.getElementById('appBody');
        app.innerHTML = `
            <div class="menu-screen">
                <div class="menu-top-bar">
                    <button class="icon-btn" onclick="renderListScreen()">✕</button>
                    <button class="icon-btn">설정</button>
                </div>

                <div class="menu-icons">
                    <div class="menu-icon-btn">고객센터</span></div>
                    <div class="menu-icon-btn">공지사항</span></div>
                    <div class="menu-icon-btn"><알림</span></div>
                </div>

                <div class="banner-box">
                    모바일 신분증<br>자주 사용하는 앱으로 간편하게 이용해 보세요
                </div>

                <div class="menu-list-section">
                    <div class="menu-item-row" onclick="renderListScreen()">나의 신분증 관리</div>
                    <div class="menu-item-row">사용이력</div>
                </div>

                <div class="menu-list-section">
                    <div class="menu-section-title">편의 서비스</div>
                    <div class="menu-item-row">전자증명서</div>
                    <div class="menu-item-row">국민비서</div>
                </div>
            </div>
        `;
    }

    // 4. 메인 신분증 카드 화면
    function renderMainCardScreen() {
        const displayRrnBack = state.showFullRrn ? state.rrnBack : state.rrnBack[0] + "******";
        const app = document.getElementById('appBody');

        app.innerHTML = `
            <div class="app-header">
                <button class="icon-btn" onclick="renderMenuScreen()">☰</button>
                <div class="header-title">모바일 신분증</div>
                <button class="icon-btn" onclick="openEditModal()">+</button>
            </div>

            <div class="notice-banner">
                누르거나 흔들어서 모든 정보를 볼 수 있어요.
            </div>

            <div class="id-card-wrap">
                <div class="id-card" onclick="openDarkModal()">
                    <div class="card-header-v">
                        <div class="card-title-v">주민등록증</div>
                    </div>
                    
                    <div class="card-body-v">
                        <div class="vertical-text">${state.name}</div>
                        <div class="vertical-text clickable-rrn" onclick="toggleRrn(event)">
                            ${state.rrnFront}-${displayRrnBack}
                        </div>
                    </div>

                    <div class="card-footer-v">
                        <div class="photo-box">
                            <img src="${state.photoSrc}" alt="사진">
                        </div>
                        <div class="vertical-text" style="font-size:12px;">
                            ${state.address1} ${state.address2}
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-nav">
                <button class="nav-btn" onclick="renderQrScreen()">나의 QR</span></button>
                <button class="nav-btn" onclick="alert('촬영 기능 실행')">QR 촬영</span></button>
            </div>
        `;
    }

    // 5. QR 화면
    function renderQrScreen() {
        const app = document.getElementById('appBody');
        app.innerHTML = `
            <div class="app-header">
                <button class="icon-btn" onclick="renderMainCardScreen()">←</button>
                <div class="header-title">나의 QR</div>
                <div style="width:24px;"></div>
            </div>
            <div style="padding:30px; text-align:center;">
                <h3>${state.name} 님의 QR 코드</h3>
                <div id="qrcode" style="display:flex; justify-content:center; margin:20px 0;"></div>
                <button onclick="renderMainCardScreen()" style="width:100%; padding:12px; background:#4A90E2; color:white; border:none; border-radius:8px;">닫기</button>
            </div>
        `;
        new QRCode(document.getElementById("qrcode"), {
            text: "https://www.mobileid.go.kr",
            width: 160,
            height: 160
        });
    }

    // 주민번호 뒷자리 토글
    function toggleRrn(e) {
        e.stopPropagation();
        state.showFullRrn = !state.showFullRrn;
        renderMainCardScreen();
    }

    // 모달 관리
    function openEditModal() {
        document.getElementById('editName').value = state.name;
        document.getElementById('editRrnBack').value = state.rrnBack;
        document.getElementById('editAddr1').value = state.address1;
        document.getElementById('editAddr2').value = state.address2;
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function saveInfo() {
        state.name = document.getElementById('editName').value;
        state.rrnBack = document.getElementById('editRrnBack').value;
        state.address1 = document.getElementById('editAddr1').value;
        state.address2 = document.getElementById('editAddr2').value;

        const photoFile = document.getElementById('editPhoto').files[0];
        if (photoFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                state.photoSrc = e.target.result;
                closeEditModal();
                renderMainCardScreen();
            };
            reader.readAsDataURL(photoFile);
        } else {
            closeEditModal();
            renderMainCardScreen();
        }
    }

    function openDarkModal() {
        document.getElementById('darkName').innerText = state.name;
        document.getElementById('darkRrn').innerText = `${state.rrnFront}-${state.rrnBack}`;
        document.getElementById('darkAddr').innerText = `${state.address1} ${state.address2}`;
        document.getElementById('darkPhoto').src = state.photoSrc;
        document.getElementById('darkDetailModal').style.display = 'flex';
    }

    function closeDarkModal() {
        document.getElementById('darkDetailModal').style.display = 'none';
    }
</script>
</body>
</html>
