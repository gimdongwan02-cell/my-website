<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>모바일신분증</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }
        input[type="password"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .result-content {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>조회하기</h2>
    
    <!-- 비밀번호 입력 창 -->
    <div id="loginSection">
        <input type="password" id="passwordInput" placeholder="비밀번호 입력">
        <br>
        <button onclick="checkPassword()">조회하기</button>
        <p id="errorMsg" class="error-message">비밀번호가 틀렸습니다.</p>
    </div>

    <!-- 비밀번호 인증 성공 시 표시될 조회 결과 -->
    <div id="resultContent" class="result-content">
        <h3>조회 결과</h3>
        <p>인증에 성공했습니다!</p>
        <p>비밀번호 <strong>10000</strong>이 확인되어 숨겨진 데이터가 출력됩니다.</p>
    </div>
</div>

<script>
    function checkPassword() {
        const passwordInput = document.getElementById('passwordInput').value;
        const errorMsg = document.getElementById('errorMsg');
        const resultContent = document.getElementById('resultContent');

        // 비밀번호가 '10000'인지 확인
        if (passwordInput === "10000") {
            errorMsg.style.display = "none";
            resultContent.style.display = "block";
        } else {
            resultContent.style.display = "none";
            errorMsg.style.display = "block";
        }
    }
</script>

</body>
</html>
