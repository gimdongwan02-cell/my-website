<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앱 인증 화면 예시</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 390px;
            height: 844px;
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. 스플래시 화면 */
        .splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        .splash-logo {
            width: 80px;
            height: 80px;
            background-color: #4A90E2;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .splash-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .splash-desc {
            font-size: 14px;
            color: #888;
        }

        .loader {
            margin-top: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4A90E2;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 2. 비밀번호 입력 화면 */
        .auth-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 20px 20px 20px;
        }

        .auth-header {
            text-align: center;
            margin-top: 40px;
        }

        .auth-title {
            font-size: 18px;
            font-weight: 600;
            color: #222;
            margin-bottom: 24px;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #e0e0e0;
            transition: background-color 0.2s;
        }

        .dot.active {
            background-color: #4A90E2;
        }

        /* 키패드 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-bottom: 20px;
        }

        .key-btn {
            height: 60px;
            border: none;
            background-color: transparent;
            font-size: 22px;
            font-weight: 500;
            color: #333;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .key-btn:active {
            background-color: #f0f0f0;
        }

        .key-btn.action-btn {
            font-size: 14px;
            color: #666;
        }

        /* 조회하기 화면 스타일 */
        .result-container {
            text-align: center;
            margin-top: 120px;
            padding: 0 20px;
        }

        .result-btn {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 16px 0;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.2s;
        }

        .result-btn:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- 1. 스플래시 화면 -->
        <div class="splash-screen" id="splash">
            <div class="splash-logo">APP</div>
            <div class="splash-title">서비스 이름</div>
            <div class="splash-desc">안전하게 연결 중입니다</div>
            <div class="loader"></div>
        </div>

        <!-- 2. 인증 화면 및 결과 화면이 표시될 영역 -->
        <div class="auth-screen" id="mainContent">
            <div class="auth-header">
                <div class="auth-title">비밀번호 6자리를 입력해 주세요</div>
                <div class="pin-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <!-- 숫자 키패드 -->
            <div class="keypad">
                <button class="key-btn" onclick="pressKey('1')">1</button>
                <button class="key-btn" onclick="pressKey('2')">2</button>
                <button class="key-btn" onclick="pressKey('3')">3</button>
                <button class="key-btn" onclick="pressKey('4')">4</button>
                <button class="key-btn" onclick="pressKey('5')">5</button>
                <button class="key-btn" onclick="pressKey('6')">6</button>
                <button class="key-btn" onclick="pressKey('7')">7</button>
                <button class="key-btn" onclick="pressKey('8')">8</button>
                <button class="key-btn" onclick="pressKey('9')">9</button>
                <button class="key-btn action-btn" onclick="clearAll()">전체삭제</button>
                <button class="key-btn" onclick="pressKey('0')">0</button>
                <button class="key-btn action-btn" onclick="deleteKey()">←</button>
            </div>
        </div>
    </div>

    <!-- 스크립트 (기능 제어) -->
    <script>
        // 1. 스플래시 화면 자동 닫기 (2.5초)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.visibility = 'hidden';
                }, 500);
            }, 2500);
        });

        // 2. 키패드 및 비밀번호 검증 로직
        let inputPin = [];
        const maxLen = 6;
        const targetPin = "777777"; // 설정된 정답 비밀번호
        const dots = document.querySelectorAll('.dot');

        function updateDots() {
            dots.forEach((dot, idx) => {
                if (idx < inputPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function pressKey(num) {
            if (inputPin.length < maxLen) {
                inputPin.push(num);
                updateDots();

                // 6자리가 모두 입력되면 확인
                if (inputPin.length === maxLen) {
                    const enteredPin = inputPin.join('');

                    setTimeout(() => {
                        if (enteredPin === targetPin) {
                            // 777777 입력 시 조회하기 화면으로 전환
                            showResultScreen();
                        } else {
                            // 틀렸을 경우 알림 후 초기화
                            alert('비밀번호가 일치하지 않습니다. (정답: 777777)');
                            clearAll();
                        }
                    }, 200);
                }
            }
        }

        function deleteKey() {
            if (inputPin.length > 0) {
                inputPin.pop();
                updateDots();
            }
        }

        function clearAll() {
            inputPin = [];
            updateDots();
        }

        // 3. 인증 성공 시 화면 전환 함수
        function showResultScreen() {
            const mainContent = document.getElementById('mainContent');
            
            // 화면 내용을 조회하기 버튼 형태로 변경
            mainContent.innerHTML = `
                <div class="result-container">
                    <h2 style="font-size: 22px; color: #333; margin-bottom: 10px;">인증 완료! 🎉</h2>
                    <p style="color: #666; font-size: 15px;">비밀번호가 정상적으로 확인되었습니다.</p>
                    <button class="result-btn" onclick="alert('조회 페이지로 이동합니다.')">조회하기</button>
                </div>
            `;
        }
    </script>
</body>
</html>
