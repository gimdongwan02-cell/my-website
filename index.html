<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일신분증</title>
                     
   <!-- 홈 화면 추가 실행 시 주소창 제거 메타 태그 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">

    <!-- QR 코드 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #ffffff;
            /* 스크롤이 가능하도록 auto로 설정 */
            overflow-x: hidden;
            overflow-y: auto;
        }

        .mobile-container {
            width: 100vw;
            min-height: 100vh;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 1. 스플래시 화면 (고정 위치) */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        .splash-logo {
            width: 80px;
            height: 80px;
            background-color: #4A90E2;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .splash-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .splash-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .splash-desc {
            font-size: 14px;
            color: #888;
        }

        .loader {
            margin-top: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4A90E2;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 2. 비밀번호 및 컨텐츠 영역 */
        .auth-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px 30px 20px;
            min-height: 100vh;
        }

        .auth-header {
            text-align: center;
            margin-top: 20px;
        }

        .auth-title {
            font-size: 18px;
            font-weight: 600;
            color: #222;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #e0e0e0;
            transition: background-color 0.2s;
        }

        .dot.active {
            background-color: #4A90E2;
        }

        /* 키패드 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-bottom: 20px;
            margin-top: 20px;
        }

        .key-btn {
            height: 60px;
            border: none;
            background-color: transparent;
            font-size: 22px;
            font-weight: 500;
            color: #333;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .key-btn:active {
            background-color: #e8e8e8;
        }

        .key-btn.action-btn {
            font-size: 14px;
            color: #666;
        }

        /* 3. 조회 및 QR 결과 화면 */
        .result-container {
            text-align: center;
            padding: 60px 20px 40px 20px;
            width: 100%;
        }

        .result-btn {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 16px 0;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .result-btn:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- 스플래시 화면 -->
        <div class="splash-screen" id="splash">
            <div class="splash-logo">
                <img src="logo.jpg" alt="로고" onerror="this.style.display='none'; this.parentNode.innerText='APP';">
            </div>
            <div class="splash-title">모바일신분증</div>
            <div class="splash-desc">어디서나 편하게</div>
            <div class="loader"></div>
        </div>

        <!-- 인증 및 컨텐츠 영역 -->
        <div class="auth-screen" id="mainContent">
            <div class="auth-header">
                <div class="auth-title">모바일신분증앱<br>비밀번호 6자리를 입력해 주세요</div>
                <div class="pin-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <!-- 숫자 키패드 -->
            <div class="keypad">
                <button class="key-btn" onclick="pressKey('1')">1</button>
                <button class="key-btn" onclick="pressKey('2')">2</button>
                <button class="key-btn" onclick="pressKey('3')">3</button>
                <button class="key-btn" onclick="pressKey('4')">4</button>
                <button class="key-btn" onclick="pressKey('5')">5</button>
                <button class="key-btn" onclick="pressKey('6')">6</button>
                <button class="key-btn" onclick="pressKey('7')">7</button>
                <button class="key-btn" onclick="pressKey('8')">8</button>
                <button class="key-btn" onclick="pressKey('9')">9</button>
                <button class="key-btn action-btn" onclick="clearAll()">전체삭제</button>
                <button class="key-btn" onclick="pressKey('0')">0</button>
                <button class="key-btn action-btn" onclick="deleteKey()">←</button>
            </div>
        </div>
    </div>

    <script>
        // 스플래시 화면 제어 (2.5초 후 닫힘)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.visibility = 'hidden';
                    }, 500);
                }
            }, 2500);
        });

        // 비밀번호 설정
        let inputPin = [];
        const maxLen = 6;
        const targetPin = "777777";
        const dots = document.querySelectorAll('.dot');

        function updateDots() {
            dots.forEach((dot, idx) => {
                if (idx < inputPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function pressKey(num) {
            if (inputPin.length < maxLen) {
                inputPin.push(num);
                updateDots();

                if (inputPin.length === maxLen) {
                    const enteredPin = inputPin.join('');

                    setTimeout(() => {
                        if (enteredPin === targetPin) {
                            showResultScreen();
                        } else {
                            alert('비밀번호가 일치하지 않습니다.');
                            clearAll();
                        }
                    }, 200);
                }
            }
        }

        function deleteKey() {
            if (inputPin.length > 0) {
                inputPin.pop();
                updateDots();
            }
        }

        function clearAll() {
            inputPin = [];
            updateDots();
        }

        // 1단계: 비번 풀렸을 때 [조회하기] 화면
        function showResultScreen() {
            const mainContent = document.getElementById('mainContent');
            
            mainContent.innerHTML = `
                <div class="result-container">
                    <h2 style="font-size: 22px; color: #333; margin-bottom: 10px;">인증 성공! 🎉</h2>
                    <p style="color: #666; font-size: 15px; margin-bottom: 30px;">신분증 정보를 조회할 수 있습니다.</p>
                    <button class="result-btn" onclick="showQrCode()">조회하기</button>
                </div>
            `;
        }

        // 2단계: [조회하기] 누르면 'QR코드 표시' 버튼과 함께 QR 생성
        function showQrCode() {
            const mainContent = document.getElementById('mainContent');
            
            mainContent.innerHTML = `
                <div class="result-container">
                    <h2 style="font-size: 20px; color: #333; margin-bottom: 10px;">QR 코드 표시</h2>
                    <p style="color: #666; font-size: 14px; margin-bottom: 25px;">아래 QR 코드를 스캔해 주세요.</p>
                    
                    <div id="qrcode" style="display: flex; justify-content: center; margin-bottom: 20px;"></div>

                    <button class="result-btn" onclick="location.reload()">처음으로</button>
                </div>
            `;

            new QRCode(document.getElementById("qrcode"), {
                text: "https://www.seoul.go.kr",
                width: 160,
                height: 160
            });
        }
    </script>
</body>
</html>
